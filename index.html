<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김해구지초 배드민턴 연습 일정</title>
  
  <!-- 바탕화면 어플 아이콘 세팅 (셔틀콕) -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://cdn-icons-png.flaticon.com/512/2906/2906803.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn-icons-png.flaticon.com/512/2906/2906803.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/2906/2906803.png">
  <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/2906/2906803.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="배드민턴일정">
  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; }
    header { max-width: 600px; margin: 0 auto 12px; text-align: center; }
    header h1 { font-size: 20px; color: var(--primary-color); margin-bottom: 4px; }
    header p { font-size: 13px; color: var(--text-sub); }
    .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    
    /* 흘러가는 전광판 공지사항 스타일 */
    .notice-bar {
      background-color: #1e293b;
      color: #fbbf24;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
    }
    .notice-icon {
      margin-right: 8px;
      flex-shrink: 0;
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #ffffff;
    }
    .notice-content-wrapper {
      overflow: hidden;
      width: 100%;
    }
    .notice-content {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: marquee 12s linear infinite;
    }
    .notice-bar:hover .notice-content {
      animation-play-state: paused;
    }
    @keyframes marquee {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* 미니 달력 스타일 */
    .calendar-card { background: var(--card-bg); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; }
    .calendar-header button { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--primary-color); padding: 4px 8px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; }
    .cal-day-head { font-weight: bold; color: var(--text-sub); padding: 4px 0; }
    .cal-day { padding: 8px 0; border-radius: 6px; position: relative; background: #fafafa; }
    .cal-day.has-event { background: #dbeafe; color: var(--primary-color); font-weight: bold; cursor: pointer; }
    .cal-day.has-event::after { content: '•'; position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); color: var(--primary-color); font-size: 10px; }

    /* 일정 카드 및 시간 강조 디자인 */
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); overflow: hidden; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .date-badge { background: #eff6ff; color: var(--primary-color); font-weight: bold; font-size: 15px; padding: 5px 12px; border-radius: 20px; }
    
    .time-highlight-box {
      background-color: #fef3c7;
      border-left: 5px solid #f59e0b;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }
    .time-badge {
      font-size: 18px;
      font-weight: 800;
      color: #b45309;
      letter-spacing: -0.5px;
    }

    .card-body { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.4; word-break: break-all; }
    
    /* 세로 배치 레이아웃 (잘림 방지) */
    .attendance-section { 
      border-top: 1px dashed var(--border-color); 
      padding-top: 12px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    .attendance-list { font-size: 13px; color: var(--text-sub); word-break: break-all; }
    .attendance-list strong { color: var(--primary-color); }

    .action-group { 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      width: 100%;
    }
    
    .input-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    input[type="text"] { 
      width: 100%;
      padding: 10px 12px; 
      border: 1px solid var(--border-color); 
      border-radius: 6px; 
      font-size: 14px; 
      outline: none; 
      box-sizing: border-box;
    }

    .button-container {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    button.btn-action { 
      flex: 1;
      padding: 11px 0; 
      border: none; 
      border-radius: 6px; 
      font-size: 14px; 
      font-weight: bold; 
      cursor: pointer; 
      text-align: center;
    }
    .btn-attend { background: var(--primary-color); color: white; }
    .btn-absent { background: #f1f5f9; color: #475569; }
    .loading { text-align: center; padding: 30px; color: var(--text-sub); }
  </style>
</head>
<body>

  <header>
    <h1>🏸 김해구지초 배드민턴 연습 일정</h1>
    <p>달력으로 전체 일정을 보고 참석 여부를 입력하세요.</p>
  </header>

  <div class="container">
    <div class="notice-bar">
      <span class="notice-icon">📢 공지</span>
      <div class="notice-content-wrapper">
        <span class="notice-content" id="noticeContent">공지사항을 불러오는 중입니다...</span>
      </div>
    </div>

    <div class="calendar-card">
      <div class="calendar-header">
        <button onclick="prevMonth()">&lt;</button>
        <span id="calMonthTitle"></span>
        <button onclick="nextMonth()">&gt;</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div id="app">
      <div class="loading">일정을 불러오는 중입니다...</div>
    </div>
  </div>

  <script>
    // 복사해주신 구글 앱스 스크립트 배포 주소를 적용했습니다.
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyhnLDXvrvFrLV1tk3fD4PIj2w-rlKqX-ERk4RLQu40d32vKYoIk3n16746HdFkz8_EYA/exec";

    let allSchedules = [];
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    window.onload = function() {
      fetchSchedules();
    };

    function fetchSchedules() {
      fetch(GAS_API_URL)
        .then(response => response.json())
        .then(data => {
          allSchedules = data.schedules || [];
          document.getElementById('noticeContent').innerText = data.notice || '공지사항이 없습니다.';
          renderCalendar();
          renderSchedules(allSchedules);
        })
        .catch(err => {
          document.getElementById('app').innerHTML = '<div class="loading">데이터를 불러오지 못했습니다. 앱스 스크립트 배포 권한을 확인해 주세요.</div>';
          console.error(err);
        });
    }

    function renderCalendar() {
      document.getElementById('calMonthTitle').innerText = `${currentYear}년 ${currentMonth + 1}월`;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const dayHeads = ['일', '월', '화', '수', '목', '금', '토'];
      dayHeads.forEach(d => {
        grid.innerHTML += `<div class="cal-day-head">${d}</div>`;
      });

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= lastDate; day++) {
        const monthStr = String(currentMonth + 1).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

        const hasEvent = allSchedules.some(s => s.date === dateKey);
        const eventClass = hasEvent ? 'has-event' : '';

        grid.innerHTML += `<div class="cal-day ${eventClass}" onclick="filterByDate('${dateKey}')">${day}</div>`;
      }
    }

    function prevMonth() { currentMonth--; if(currentMonth < 0){ currentMonth=11; currentYear--; } renderCalendar(); }
    function nextMonth() { currentMonth++; if(currentMonth > 11){ currentMonth=0; currentYear++; } renderCalendar(); }

    function filterByDate(dateKey) {
      const filtered = allSchedules.filter(s => s.date === dateKey);
      if (filtered.length > 0) {
        renderSchedules(filtered);
      } else {
        alert(dateKey + '에는 등록된 연습 일정이 없습니다.');
        renderSchedules(allSchedules);
      }
    }

    function renderSchedules(schedules) {
      const app = document.getElementById('app');
      if (!schedules || schedules.length === 0) {
        app.innerHTML = '<div class="loading">등록된 일정이 없습니다.</div>';
        return;
      }

      app.innerHTML = '';
      schedules.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '12px';
        card.innerHTML = `
          <div class="card-header">
            <span class="date-badge">📅 ${item.date} (${item.dayOfWeek})</span>
          </div>
          <div class="time-highlight-box">
            <span class="time-badge">⏰ ${item.time}</span>
          </div>
          <div class="card-body">
            <div>📍 <strong>장소:</strong> ${item.location}</div>
            <div>📝 <strong>내용:</strong> ${item.description}</div>
          </div>
          <div class="attendance-section">
            <div class="attendance-list">
              👥 <strong>참석 명단:</strong> <span id="attendees-${item.rowIndex}">${item.attendees || '없음'}</span>
            </div>
            <div class="action-group">
              <div class="input-row">
                <input type="text" id="name-${item.rowIndex}" placeholder="본인 이름 (필수)">
                <input type="text" id="note-${item.rowIndex}" placeholder="요청사항 (선택: 지각/조퇴 등)">
              </div>
              <div class="button-container">
                <button class="btn-action btn-attend" onclick="submitAttendance(${item.rowIndex}, true)">참석</button>
                <button class="btn-action btn-absent" onclick="submitAttendance(${item.rowIndex}, false)">불참</button>
              </div>
            </div>
          </div>
        `;
        app.appendChild(card);
      });
    }

    function submitAttendance(rowIndex, isAttending) {
      const nameInput = document.getElementById(`name-${rowIndex}`);
      const noteInput = document.getElementById(`note-${rowIndex}`);
      
      const userName = nameInput.value.trim();
      const userNote = noteInput.value.trim();

      if (!userName) {
        alert('이름을 입력해 주세요.');
        return;
      }

      const displayName = userNote ? `${userName} (${userNote})` : userName;

      const payload = {
        rowIndex: rowIndex,
        rawUserName: userName,
        displayName: displayName,
        isAttending: isAttending
      };

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          document.getElementById(`attendees-${rowIndex}`).innerText = res.updatedAttendees || '없음';
          nameInput.value = '';
          noteInput.value = '';
          const target = allSchedules.find(s => s.rowIndex === rowIndex);
          if (target) target.attendees = res.updatedAttendees;
        } else {
          alert('처리 중 오류가 발생했습니다.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('서버와 통신할 수 없습니다.');
      });
    }
  </script>
</body>
</html>
